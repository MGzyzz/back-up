telegram:
  # ID канала с уведомлениями. Принимается и короткий вид (1234567890),
  # и привычный по Bot API (-1001234567890).
  channel_id: -1001234567890
  # Файл сессии MTProto. Создаётся запуском с -login.
  session_path: ./data/session.json

schedule:
  # Используется только в режиме -daemon; при запуске из cron не нужен.
  report_at: "11:00"
  timezone: Asia/Almaty

google:
  # Хвост URL папки Drive после /folders/
  folder_id: "СЮДА_ID_ПАПКИ"
  # OAuth-токен пользователя. Создаётся при первом входе через браузер.
  token_path: ./data/google_token.json
  retention_days: 30

# LABELS из сообщения -> как бэкап называется в отчёте.
#
# Строка сводки заводится на каждую МЕТКУ, а не на тип, поэтому имена должны
# различать задачи: MINIO_BACKUPS и MINIO_BACKUPS_AI_BUCKET — два разных
# бэкапа, и одинаковое имя "MinIO" сделало бы сводку нечитаемой.
# Если две метки в одном окружении получат одно имя, сервис напишет WARN.
#
# Метке, которой здесь нет, сервис даст имя "UNKNOWN (МЕТКА)" и напишет WARN
# с её названием — по нему строку сюда и дописывают.
labels:
  # PostgreSQL. PGBACKREST и PGBACKREST_BACKUP делят имя намеренно:
  # похоже на одну задачу до и после переименования метки. Если обе
  # придут в одном окружении в один день — сработает WARN, тогда развести.
  PGBACKREST: PostgreSQL
  PGBACKREST_BACKUP: PostgreSQL
  PGBACKREST_CLOUD_BACKUP: PostgreSQL Cloud
  # Опечатка на стороне отправителя: PGBACKERST вместо PGBACKREST.
  # Ключ обязан совпадать с тем, что реально приходит в канал, — не «чинить».
  PGBACKERST_VK_CLOUD_BACKUP: PostgreSQL VK Cloud
  POSTGRES-LASTBACKUP: PostgreSQL LastBackup

  # MongoDB
  MONGODB_BACKUP: MongoDB
  MONGODB_BACKUP_REMOTE_REPO: MongoDB Remote

  # MinIO
  MINIO_BACKUPS: MinIO
  MINIO_BACKUPS_AI_BUCKET: MinIO AI
  MINIO_VK_CLOUD_BACKUP: MinIO VK Cloud
  # Возможно, второе написание MINIO_VK_CLOUD_BACKUP: ALERT у этой метки —
  # "VK CLOUD BACKUP command was not executed". Пока имя отдельное: свести
  # к "MinIO VK Cloud", когда подтвердится, что задача одна.
  MINIO_CLOUD_BACKUP: MinIO Cloud

  # etcd. Метка приходит с пробелами, а не подчёркиваниями — отсюда кавычки.
  "TELEPORT ETCD BACKUP": Teleport etcd

  # Baiterek. Отчитывается SUCCESS без BACKUP START/FINISHED TIME, поэтому
  # время и длительность в сводке пустые, а сервис пишет WARN «успешный
  # бэкап без времён». Убрать метку отсюда нельзя — строка всё равно
  # попадёт в отчёт, только под именем "UNKNOWN (МЕТКА)".
  "BAITEREK COPY TO SECOND VM": Baiterek copy to VM2
