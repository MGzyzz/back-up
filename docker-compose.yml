services:
  back_end:
    build:
      context: ./back_end
      dockerfile: ../docker/back_end.Dockerfile
    env_file:
      - ./back_end/.env
    volumes:
      # session.json пишется контейнером — том на запись.
      - ./back_end/data:/app/data
      - ./back_end/config.yaml:/app/config.yaml:ro
    # secrets/ не монтируется намеренно: client_secret.json нужен только
    # cmd/report, а сервер про Google не знает.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  front_end:
    build:
      context: ./front_end
      dockerfile: ../docker/front_end.Dockerfile
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      back_end:
        condition: service_healthy
    restart: unless-stopped
